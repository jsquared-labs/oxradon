<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>Time to analyze 3,824 Python files: radon and oxradon</title>
