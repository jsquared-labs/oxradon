<text x="600" y="92" fill="#C4501B" text-anchor="end" font-size="14" font-weight="400">0.26 s</text>
<text x="760" y="94" fill="#C4501B" text-anchor="end" font-size="19" font-weight="700">25x faster</text>
<text x="0" y="136" fill="#1F1B16" text-anchor="start" font-size="15" font-weight="600">raw</text>
<rect x="56" y="122" width="294.0" height="18" rx="2" fill="#CFC7B8"/>
<rect x="56" y="119" width="3" height="24" fill="#C4501B"/>
